name: Build & Push Docker Image

# Forgejo Actions counterpart of .github/workflows/docker.yml: pushing a
# v<semver> tag builds the root Dockerfile and pushes the image to a registry,
# with the same tag scheme the GitHub release workflows publish:
#
#   v4.3.0        -> :4.3.0        :4      :latest
#   v4.4.0-pre.1  -> :4.4.0-pre.1  :4-pre  :latest-pre
#
# Only official images are used: the job runs in docker:29-cli and builds with
# the daemon's own BuildKit, so no builder or QEMU helper image is pulled.
# Runner setup and the repository secrets/variables this reads are documented
# in .forgejo/runner/README.md.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    # The runner must give job containers a Docker 29+ daemon — .forgejo/runner/
    # sets that up with Docker-in-Docker.
    runs-on: docker
    # Pinned here rather than left to the runner's label mapping: the default
    # node image has no docker CLI. docker:cli ships the CLI, buildx and git.
    container:
      image: docker:29-cli
    defaults:
      run:
        shell: sh
    steps:
      # The JavaScript actions below need node, which docker:cli lacks.
      - name: Install node
        run: apk add --no-cache nodejs

      - name: Resolve image name and tags
        id: meta
        env:
          TAG: ${{ forgejo.ref_name }}
          SERVER_URL: ${{ forgejo.server_url }}
          REPOSITORY: ${{ forgejo.repository }}
          REGISTRY: ${{ vars.REGISTRY }}
          IMAGE: ${{ vars.IMAGE }}
        run: |
          set -eu
          VERSION="${TAG#v}"
          # APP_VERSION must be semver, or the plugin TREK-compatibility gate
          # switches itself off (server/src/nest/plugins/install/host-compat.ts).
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag $TAG is not v<major>.<minor>.<patch>[-<prerelease>]"
            exit 1
          fi

          # Default to this Forgejo instance's own container registry.
          if [ -z "$REGISTRY" ]; then
            REGISTRY="${SERVER_URL#*://}"
            REGISTRY="${REGISTRY%%/*}"
          fi
          # Registries reject upper-case repository names.
          IMAGE="$(printf '%s' "${IMAGE:-$REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          REF="$REGISTRY/$IMAGE"

          MAJOR="${VERSION%%.*}"
          case "$VERSION" in
            *-*) SUFFIX="-pre" ;;
            *) SUFFIX="" ;;
          esac

          {
            echo "registry=$REGISTRY"
            echo "ref=$REF"
            echo "version=$VERSION"
            echo "tags<<EOF"
            echo "$REF:$VERSION"
            echo "$REF:$MAJOR$SUFFIX"
            echo "$REF:latest$SUFFIX"
            echo "EOF"
          } >> "$FORGEJO_OUTPUT"
          echo "Publishing $REF:{$VERSION,$MAJOR$SUFFIX,latest$SUFFIX}"

      - uses: actions/checkout@v4

      # Absolute URLs: the docker/* actions are not guaranteed to be mirrored
      # on the instance's DEFAULT_ACTIONS_URL. setup-buildx-action and
      # setup-qemu-action are left out on purpose — they pull non-official
      # images (moby/buildkit, tonistiigi/binfmt).
      - uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ steps.meta.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          # Empty builds for the runner's native platform only. Other platforms
          # need QEMU registered on the build host (.forgejo/runner/README.md).
          platforms: ${{ vars.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}

      - name: Inspect pushed image
        env:
          REF: ${{ steps.meta.outputs.ref }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$REF:$VERSION"
